name: Refresh Rocketlane Data

on:
  schedule:
    # Runs every 4 hours (adjust as needed)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Also allows manual trigger from GitHub Actions UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh Rocketlane task data from Databricks
        env:
          DATABRICKS_HOST:         ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_TOKEN:        ${{ secrets.DATABRICKS_TOKEN }}
        run: python scripts/refresh_rl_data.py

      - name: Commit updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh Rocketlane task data [skip ci]"
            git push
          fi
