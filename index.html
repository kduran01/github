<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integration Status Dashboard</title>
<style>
:root {
  color-scheme: light;
  --green: #22c55e; --orange: #f97316; --red: #ef4444;
  --border: #e5e7eb; --text: #111827; --text-secondary: #6b7280;
  --primary: #4f46e5; --header-bg: #1e1b4b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f3f4f6; color: var(--text); font-size: 13px; line-height: 1.4; }

.dashboard-header { background: var(--header-bg); color: white; padding: 14px 20px 12px; position: sticky; top: 0; z-index: 100; }
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.dashboard-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
.dashboard-title .subtitle { opacity: 0.6; font-weight: 400; font-size: 12px; margin-left: 10px; }
.header-actions { display: flex; align-items: center; gap: 12px; }
.last-updated { font-size: 11px; opacity: 0.55; }
.btn-refresh { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); color: white; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.btn-refresh:hover { background: rgba(255,255,255,0.25); }
.btn-refresh:disabled { opacity: 0.45; cursor: not-allowed; }
.stats-bar { display: flex; gap: 10px; flex-wrap: wrap; }
.stat-chip { background: rgba(255,255,255,0.1); border-radius: 20px; padding: 3px 12px; font-size: 11px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.stat-dot { width: 7px; height: 7px; border-radius: 50%; }

/* Status banner */
.data-status-bar { font-size: 11px; padding: 6px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.data-status-bar.ok   { background: #f0fdf4; border-bottom: 1px solid #bbf7d0; color: #15803d; }
.data-status-bar.warn { background: #fffbeb; border-bottom: 1px solid #fde68a; color: #92400e; }
.data-status-bar.err  { background: #fef2f2; border-bottom: 1px solid #fecaca; color: #b91c1c; }
.source-badge { font-weight: 600; padding: 1px 8px; border-radius: 10px; font-size: 10px; }
.source-badge.ok  { background: #dcfce7; color: #15803d; }
.source-badge.err { background: #fee2e2; color: #b91c1c; }
.source-badge.loading { background: #e0e7ff; color: #4338ca; }

.controls { background: white; border-bottom: 1px solid var(--border); padding: 9px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 180px; }
.search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #9ca3af; pointer-events: none; }
.search-input { width: 100%; padding: 6px 10px 6px 28px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; background: #f9fafb; }
.search-input:focus { outline: none; border-color: var(--primary); background: white; }
.filter-select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: white; color: var(--text); cursor: pointer; }
.month-tabs { display: flex; gap: 3px; }
.month-tab { padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border); background: white; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-secondary); transition: all 0.15s; }
.month-tab.active { background: var(--primary); color: white; border-color: var(--primary); }
.view-tabs { display: flex; gap: 3px; margin-left: auto; }


.table-wrapper { overflow-x: auto; background: white; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #f8fafc; border-bottom: 2px solid var(--border); padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-secondary); white-space: nowrap; cursor: pointer; user-select: none; }
thead th:hover { color: var(--text); }
thead th.sorted { color: var(--primary); }
tbody tr { border-bottom: 1px solid #f0f0f0; }
tbody tr.data-row:hover { background: #f8fafc; cursor: pointer; }
tbody tr.expanded-row-parent { background: #f0f9ff !important; }
tbody td { padding: 9px 12px; vertical-align: middle; }

.status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.status-dot.green  { background: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
.status-dot.orange { background: var(--orange); box-shadow: 0 0 0 3px rgba(249,115,22,0.15); }
.status-dot.red    { background: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,0.15); }
.status-dot.white  { background: #d1d5db; }

.days-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.days-badge.red    { background: #fef2f2; color: var(--red); }
.days-badge.orange { background: #fff7ed; color: var(--orange); }
.days-badge.white  { background: #f3f4f6; color: var(--text-secondary); }
.days-badge.live   { background: #f0fdf4; color: #15803d; }

.progress-bar { width: 56px; height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 5px; }
.progress-fill { height: 100%; border-radius: 3px; }
.expand-btn { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 11px; padding: 3px 6px; border-radius: 4px; }
.expand-btn:hover { background: var(--border); }

.detail-row { display: none; }
.detail-row.open { display: table-row; }
.detail-cell { padding: 16px 16px 20px 44px; background: #f8faff; border-bottom: 2px solid #c7d2fe; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1200px; }
@media (max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }

.section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-secondary); margin-bottom: 8px; }
.milestone-list { display: flex; flex-direction: column; gap: 5px; }
.milestone-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: white; border-left-width: 3px; }
.milestone-item.green  { border-left-color: var(--green); }
.milestone-item.orange { border-left-color: var(--orange); background: #fffcf8; }
.milestone-item.red    { border-left-color: var(--red); background: #fff5f5; }
.milestone-item.white  { border-left-color: #d1d5db; }
.m-step { font-size: 10px; font-weight: 700; color: var(--text-secondary); min-width: 18px; text-align: center; }
.m-content { flex: 1; min-width: 0; }
.m-name { font-size: 12px; font-weight: 600; }
.m-meta { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
.m-badge { font-size: 10px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.m-badge.green  { background: #f0fdf4; color: #15803d; }
.m-badge.orange { background: #fff7ed; color: #c2410c; }
.m-badge.red    { background: #fef2f2; color: #b91c1c; }
.m-badge.white  { background: #f3f4f6; color: var(--text-secondary); }

/* Interactive milestone checkboxes */
.m-checkbox { width: 20px; height: 20px; border-radius: 5px; border: 2px solid #d1d5db; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: white; font-size: 12px; font-weight: 700; user-select: none; }
.m-checkbox:hover:not(.saving) { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
.m-checkbox.checked { background: var(--green); border-color: var(--green); color: white; }
.m-checkbox.saving  { background: #e0e7ff; border-color: var(--primary); cursor: wait; animation: pulse 0.8s ease-in-out infinite; }
.m-completedby { font-size: 10px; color: #6b7280; font-style: italic; margin-top: 2px; }
.milestone-item.done-manual { border-left-color: var(--green); background: #f0fdf4; }
.milestone-item.blocker { border-left-color: var(--red); background: #fff5f5; animation: blockerPulse 1.4s ease-in-out infinite; }
@keyframes blockerPulse { 0%,100%{border-left-color:var(--red)} 50%{border-left-color:#fca5a5} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

/* Running Notes */
.notes-section { margin-top: 16px; background: white; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.notes-header { padding: 9px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fafafa; }
.notes-list { max-height: 240px; overflow-y: auto; }
.note-item { padding: 9px 14px; border-bottom: 1px solid #f3f4f6; }
.note-item:last-child { border-bottom: none; }
.note-meta { font-size: 10px; color: var(--text-secondary); margin-bottom: 3px; font-weight: 500; }
.note-text { font-size: 12px; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.notes-empty { padding: 14px; font-size: 12px; color: #9ca3af; font-style: italic; text-align: center; }
.note-input-area { padding: 10px 14px; border-top: 1px solid var(--border); background: #f9fafb; }
.note-textarea { width: 100%; min-height: 56px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; background: white; line-height: 1.5; }
.note-textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(79,70,229,0.1); }
.note-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.note-submit { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 500; }
.note-submit:hover { background: #4338ca; }
.note-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.note-status-msg { font-size: 11px; color: #6b7280; }

/* Detail layout — info bar + integration cards */
.detail-expanded { display: flex; flex-direction: column; gap: 14px; max-width: 1280px; }
.detail-info-bar { display: flex; gap: 12px; flex-wrap: wrap; }
.detail-info-block { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 11px 14px; flex: 1; min-width: 200px; }

/* Per-integration cards */
.int-card { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: white; }
.int-card-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(to right,#f8faff,#f3f4f6); border-bottom: 1px solid var(--border); flex-wrap: wrap; cursor: pointer; user-select: none; }
.int-card-header:hover { background: linear-gradient(to right,#eef2ff,#e9eaf0); }
.int-card-chevron { font-size: 11px; color: var(--text-secondary); transition: transform 0.2s; margin-left: auto; padding: 2px 4px; flex-shrink: 0; }
.int-card-chevron.collapsed { transform: rotate(-90deg); }
.int-card-body { }
.int-card-body.collapsed { display: none; }
.int-card-name { font-weight: 700; font-size: 13px; flex: 1; min-width: 120px; color: var(--text); }
.int-card-jira { display: flex; align-items: center; gap: 6px; }
.int-card-key { font-size: 11px; font-weight: 700; color: var(--primary); text-decoration: none; padding: 2px 8px; background: #eef2ff; border-radius: 10px; white-space: nowrap; }
.int-card-key:hover { background: #c7d2fe; }
.int-card-meta { font-size: 10px; color: var(--text-secondary); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.int-card-milestones { padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.int-card-comment-area { border-top: 1px solid #f0f0f0; }
.int-no-tickets { padding: 20px; text-align: center; font-size: 12px; color: #9ca3af; background: white; border: 1px solid var(--border); border-radius: 8px; }

/* Checklist section headers inside bank cards */
.checklist-section-header { font-size: 11px; font-weight: 700; letter-spacing: .03em; padding: 5px 10px; margin: 0; }
.pm-section-header  { background: #4b5563; color: #fff; }
.int-section-header { background: #374151; color: #fff; }

/* Activity feed — recent comments from Jira / Rocketlane */
.activity-feed { border-top: 1px solid #f0f0f0; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.activity-feed-header { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; margin-bottom: 2px; }
.activity-item { background: #f9fafb; border-radius: 6px; padding: 7px 10px; }
.activity-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; flex-wrap: wrap; }
.activity-source { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 5px; border-radius: 4px; }
.activity-source.jira-source { background: #e0e7ff; color: #3730a3; }
.activity-source.rl-source   { background: #dcfce7; color: #166534; }
.activity-author { font-size: 11px; font-weight: 600; color: #374151; }
.activity-date   { font-size: 10px; color: #9ca3af; margin-left: auto; }
.activity-body   { font-size: 11px; color: #4b5563; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }

/* Right column */
.detail-right { display: flex; flex-direction: column; gap: 12px; }
.detail-section { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.team-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.team-chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.team-chip.pm  { background: #eef2ff; color: #4338ca; }
.team-chip.int { background: #f0fdf4; color: #15803d; }

.jira-section { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.jira-ticket { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; background: #fafafa; text-decoration: none; color: inherit; }
.jira-ticket:hover { background: #f0f9ff; border-color: #a5b4fc; }
.jira-ticket:last-child { margin-bottom: 0; }
.jira-key { font-size: 11px; font-weight: 700; color: var(--primary); white-space: nowrap; min-width: 80px; }
.jira-content { flex: 1; min-width: 0; }
.jira-summary { font-size: 12px; font-weight: 500; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jira-meta { font-size: 10px; color: var(--text-secondary); display: flex; gap: 8px; flex-wrap: wrap; }
.jira-status { font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.jira-status.todo { background: #f3f4f6; color: #374151; }
.jira-status.inprogress { background: #dbeafe; color: #1d4ed8; }
.jira-status.inreview { background: #ede9fe; color: #6d28d9; }
.jira-status.needstesting { background: #ecfdf5; color: #065f46; }
.jira-status.waiting { background: #fef9c3; color: #854d0e; }
.jira-status.validation { background: #f0f9ff; color: #0369a1; }
.jira-status.done { background: #f0fdf4; color: #15803d; }
.stale-flag { font-size: 10px; background: #fef3c7; color: #92400e; padding: 1px 6px; border-radius: 8px; font-weight: 600; }

.comment-btn { background: none; border: 1px solid #c7d2fe; color: #4f46e5; border-radius: 6px; padding: 2px 8px; font-size: 10px; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
.comment-btn:hover { background: #eef2ff; }
.comment-form { margin-top: 8px; padding: 10px; background: #f5f3ff; border: 1px solid #c7d2fe; border-radius: 8px; }
.comment-textarea { width: 100%; min-height: 72px; padding: 8px 10px; border: 1px solid #c7d2fe; border-radius: 6px; font-size: 12px; font-family: inherit; resize: vertical; background: white; }
.comment-textarea:focus { outline: none; border-color: #4f46e5; }
.comment-actions { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.comment-submit { background: #4f46e5; color: white; border: none; border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer; font-weight: 500; }
.comment-submit:hover { background: #4338ca; }
.comment-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.comment-cancel { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
.comment-cancel:hover { background: #f3f4f6; }
.comment-status { font-size: 11px; margin-left: auto; }
.rl-link { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #4f46e5; text-decoration: none; font-weight: 500; padding: 4px 0; }
.rl-link:hover { text-decoration: underline; }

.no-tickets { border: 1.5px dashed #a5b4fc; border-radius: 8px; padding: 14px 16px; text-align: center; color: var(--text-secondary); font-size: 12px; background: #f5f3ff; }
.info-row { font-size: 12px; color: var(--text); line-height: 2; }
.info-row strong { color: var(--text-secondary); font-weight: 500; margin-right: 4px; }

.loading-state, .error-state, .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.loading-spinner { width: 30px; height: 30px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.75s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.retry-btn { margin-top: 12px; padding: 6px 18px; border: 1px solid var(--border); border-radius: 6px; background: white; cursor: pointer; font-size: 12px; }

.error-detail { background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 10px 12px; margin-top: 10px; font-size: 11px; color: #7f1d1d; text-align: left; max-width: 500px; word-break: break-all; margin-left: auto; margin-right: auto; }
</style>
</head>
<body>

<div class="dashboard-header">
  <div class="header-top">
    <div class="dashboard-title">
      🔗 Integration Status Dashboard
      <span class="subtitle" id="dashSubtitle">Loading… · Vantaca Implementations</span>
    </div>
    <div class="header-actions">
      <span class="last-updated" id="lastUpdated">—</span>
      <button class="btn-refresh" id="refreshBtn" onclick="loadData()">↻ Refresh</button>
    </div>
  </div>
  <div class="stats-bar" id="statsBar"><div class="stat-chip">Loading…</div></div>
</div>

<div class="data-status-bar" id="dataStatusBar" style="display:none"></div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="search" id="searchInput" placeholder="Search clients or PMs…" oninput="renderTable()">
  </div>
  <select class="filter-select" id="statusFilter" onchange="renderTable()">
    <option value="">All statuses</option>
    <option value="In progress">In Progress</option>
    <option value="In Planning">In Planning</option>
    <option value="Live">Live</option>
    <option value="On Hold">On Hold</option>
    <option value="Proposed">Proposed</option>
  </select>
  <select class="filter-select" id="riskFilter" onchange="renderTable()">
    <option value="">All risk levels</option>
    <option value="red">🔴 Critical</option>
    <option value="orange">🟠 At Risk</option>
    <option value="green">🟢 On Track / Live</option>
    <option value="white">⬜ Future</option>
  </select>
  <div class="month-tabs">
    <button class="month-tab active" id="tabBoth" onclick="setMonth('all')">All Months</button>
    <button class="month-tab" id="tabM1"  onclick="setMonth('m1')" style="display:none">—</button>
    <button class="month-tab" id="tabM2"  onclick="setMonth('m2')" style="display:none">—</button>
    <button class="month-tab" id="tabM3"  onclick="setMonth('m3')" style="display:none">—</button>
  </div>

</div>

<div id="mainView">
<div class="table-wrapper">
  <table>
    <thead>
      <tr>
        <th style="width:32px;cursor:default"></th>
        <th style="width:28px;cursor:default"></th>
        <th onclick="sortBy('client')"  id="th-client">Client</th>
        <th onclick="sortBy('goLive')"  id="th-goLive" class="sorted">Go-Live ↑</th>
        <th onclick="sortBy('days')"    id="th-days">Days Left</th>
        <th onclick="sortBy('pm')"      id="th-pm">PM</th>
        <th onclick="sortBy('int')"     id="th-int">INT Assigned</th>
        <th onclick="sortBy('tickets')" id="th-tickets">INT Tickets</th>
        <th onclick="sortBy('progress')"id="th-progress">Readiness</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="10"><div class="loading-state">
        <div class="loading-spinner"></div>
        <div>Connecting to Rocketlane…</div>
      </div></td></tr>
    </tbody>
  </table>
</div>
</div><!-- /mainView -->


<script>
/* ══ TOOL IDs ══ */
const DB_TOOL   = 'mcp__ace8c6f8-76f7-441f-9522-0b4ab858a385__execute_sql_read_only';
const POLL_TOOL = 'mcp__ace8c6f8-76f7-441f-9522-0b4ab858a385__poll_sql_result';
const JIRA_TOOL         = 'mcp__febcc92f-9040-4ea4-b33e-6aacbf9fcb04__searchJiraIssuesUsingJql';
const JIRA_COMMENT_TOOL = 'mcp__febcc92f-9040-4ea4-b33e-6aacbf9fcb04__addCommentToJiraIssue';
const JIRA_USER_TOOL    = 'mcp__febcc92f-9040-4ea4-b33e-6aacbf9fcb04__atlassianUserInfo';
const JIRA_CLOUD = 'd97732e2-8fd4-4a35-8c6c-eb2a8214cb23';
const JIRA_BASE  = 'https://vantaca.atlassian.net/browse/';

/* ══ TEAM CLASSIFICATION ══ */
const PM_EMAILS = new Set([
  'cameron.williams@vantaca.com',
  'janelle.james@vantaca.com',
  'kalika.shelar@vantaca.com',
  'alex.elliott@vantaca.com',
  'bill.goodwin@vantaca.com',
  'victor.majano@vantaca.com',

function normName(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }

/* ══ BUSINESS DAY HELPER ══ */
function addBusinessDays(date, n) {
  let d = new Date(date);
  let added = 0;
  const step = n >= 0 ? 1 : -1;
  const target = Math.abs(n);
  while (added < target) {
    d.setDate(d.getDate() + step);
    if (d.getDay() !== 0 && d.getDay() !== 6) added++;  // skip Sat/Sun
  }
  return d;
}

/* ══ PM ITEM STATUS CALCULATOR ══
   Implements the max() formula from Bank_Integration_Milestone_Date_Logic.md.
   Returns 'green' | 'orange' | 'red' | 'blocker' (red pulsing at GL-7)
   taskStartStr: Rocketlane task start_date string (YYYY-MM-DD), or null → GL - 60cd
*/
function computePMItemStatus(pmItem, taskStartStr, goLiveDateStr, isComplete) {
  if (isComplete) return 'green';  // checked = always green

  const today   = new Date(); today.setHours(0,0,0,0);
  const gl      = parseLocalDate(goLiveDateStr);

  // TASK_START: use RL value if available, else GL - 60cd
  const ts = taskStartStr
    ? parseLocalDate(taskStartStr)
    : new Date(gl.getTime() - 60 * 86400000);

  // On-track date
  let onTrack;
  if (pmItem.phase === 3) {
    // Phase 3: GL + onTrackCd (e.g. -30 → GL - 30cd)
    onTrack = new Date(gl.getTime() + pmItem.onTrackCd * 86400000);
  } else {
    // Phase 1 & 2: TASK_START + N business days
    onTrack = addBusinessDays(ts, pmItem.onTrackBd);
  }

  const glMinus7  = new Date(gl.getTime() - 7  * 86400000);
  const glMinus14 = new Date(gl.getTime() - 14 * 86400000);
  const glMinus21 = new Date(gl.getTime() - 21 * 86400000);

  const atRisk  = new Date(Math.max(
    onTrack.getTime() + 7  * 86400000,
    glMinus21.getTime()
  ));
  const critical = new Date(Math.max(
    onTrack.getTime() + 14 * 86400000,
    glMinus14.getTime()
  ));

  if (today > glMinus7)  return 'blocker';  // GL-7 and still not done
  if (today > critical)  return 'red';
  if (today > atRisk)    return 'orange';
  return 'white';  // not yet due and not checked → grey (neutral)
}

  window.WINDOW_START  = `${m1.getFullYear()}-${pad(m1.getMonth()+1)}-01`;
  window.WINDOW_END    = `${mEnd.getFullYear()}-${pad(mEnd.getMonth()+1)}-${pad(mEnd.getDate())}`;

/* ══ RESPONSE UNWRAPPER ══
   callMcpTool in the artifact sandbox can return several shapes:
     (a) Plain Databricks object  { statement_id, manifest, result, … }
     (b) Content-block array      [{type:'text', text:'…json…'}]
     (c) Content-block wrapper    { content: [{type:'text', text:'…json…'}] }
     (d) Plain JSON string
   We need to find the innermost object that has Databricks payload keys.
*/
function unwrap(raw) {
  if (!raw) return null;

  // Recursive helper: given any value, try to extract a meaningful object
  function extract(val) {
    if (val == null) return null;

    // Plain string — try to parse as JSON
    if (typeof val === 'string') {
      const s = val.trim();
      if (s.startsWith('{') || s.startsWith('[')) {
        try { return extract(JSON.parse(s)); } catch {}
      }
      return null;
    }

    // Array — look through elements for text blocks or nested objects
    if (Array.isArray(val)) {
      for (const item of val) {
        // Content block with text
        const txt = item?.text || item?.content;
        if (typeof txt === 'string') {
          const inner = extract(txt);
          if (inner) return inner;
        }
        // Direct object element
        if (typeof item === 'object' && item !== null && !Array.isArray(item)) {
          if (isDbResult(item)) return item;
        }
      }
      return null;
    }

    // Object — check if it's a Databricks result or a wrapper
    if (typeof val === 'object') {
      if (isDbResult(val)) return val;

      // Wrapper with a content array
      if (Array.isArray(val.content)) {
        return extract(val.content);
      }
      // Wrapper with a result key that IS a db result
      if (val.result && isDbResult(val.result)) return val.result;
      // Has issues array (Jira)
      if (Array.isArray(val.issues)) return val;

      // Last resort: return the object itself
      return val;
    }

    return null;
  }

  // A "db result" has at least one of these keys
  function isDbResult(obj) {
    return obj && (
      'statement_id' in obj ||
      'manifest'     in obj ||
      'issues'       in obj ||  // Jira
      (obj.status && typeof obj.status === 'object')
    );
  }

  const found = extract(raw);
  return found !== null ? found : raw;
}

/* Route Jira MCP tool calls to the /api/jira Azure Function */
async function callMcp(tool, params, timeoutMs = 30000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    let body;
    if (tool.includes('searchJiraIssuesUsingJql')) {
      body = {
        operation:  'searchJiraIssuesUsingJql',
        jql:        params.jql,
        maxResults: params.maxResults || 100,
        fields:     params.fields     || ['*all'],
      };
    } else if (tool.includes('addCommentToJiraIssue')) {
      body = {
        operation: 'addCommentToJiraIssue',
        issueKey:  params.issueIdOrKey,
        body:      params.body,
      };
    } else if (tool.includes('atlassianUserInfo')) {
      body = { operation: 'atlassianUserInfo' };
    } else {
      return { status: { state: 'SUCCEEDED' }, result: { data_array: [] } };
    }
    const resp = await fetch('/api/jira', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(body),
      signal:  controller.signal,
    });
    if (!resp.ok) throw new Error(`Jira API HTTP ${resp.status}`);
    return await resp.json();
  } finally {
    clearTimeout(timer);
  }
}

/* Parse a YYYY-MM-DD date string as LOCAL midnight (not UTC).
   new Date('2026-05-01') = Apr 30 in US timezones — this avoids that. */
function parseLocalDate(str) {
  if (!str) return new Date();
  const [y, m, d] = String(str).split('-').map(Number);
  return new Date(y, m - 1, d);
}

/* ══ RESULT PARSER ══ */
function parseDBResult(result) {
  if (!result) return { rows: [], error: 'No response received' };

  const st = result.status?.state;
  if (st && st !== 'SUCCEEDED') {
    return { rows: [], error: `Query state: ${st} — ${result.status?.error?.message || 'no details'}` };
  }

  // Find columns — try multiple paths
  let cols = (result.manifest?.schema?.columns || result.schema?.columns || []).map(c => c.name);

  if (!cols.length) {
    // Debug dump so we can see the actual shape
    let debug = '';
    try { debug = JSON.stringify(result).slice(0, 600); } catch(e) { debug = String(result); }
    return { rows: [], error: `Could not find schema columns. Raw response (first 600 chars): ${debug}` };
  }

  // Find data rows — try multiple paths
  const dataArray = result.result?.data_array
    || result.data_array
    || result.result?.rows
    || [];

  const rows = dataArray.map(row => {
    const obj = {};
    const values = Array.isArray(row.values) ? row.values : (Array.isArray(row) ? row : []);
    values.forEach((v, i) => {
      const col = cols[i];
      if (!col) return;
      if (v == null || (typeof v === 'object' && v !== null && 'null_value' in v)) {
        obj[col] = null;
      } else if (typeof v === 'object' && v !== null && 'string_value' in v) {
        obj[col] = v.string_value;
      } else if (typeof v === 'object' && v !== null && 'long_value' in v) {
        obj[col] = Number(v.long_value);
      } else if (typeof v === 'object' && v !== null && 'double_value' in v) {
        obj[col] = Number(v.double_value);
      } else {
        obj[col] = v;  // flat value (string/number directly)
      }
    });
    return obj;
  });

  return { rows, error: null };
}

function parseJiraResult(raw) {
  const result = unwrap(raw);
  if (!result) return [];
  if (Array.isArray(result?.issues)) return result.issues;
  if (result?.result?.issues) return result.result.issues;
  return [];
}

/* colorRank: used to find the "worst" status across all milestones */
const COLOR_RANK = { white: 0, green: 1, orange: 2, red: 3 };

/*
  rollupClientStatus(p)
  ─────────────────────
  Returns the worst PM milestone color across all bank tasks for a client.
  Uses computePMItemStatus (Phase 1/2/3 formula from milestone date logic doc).

  For each bank entry in p.bankReadinessMap:
    - Try to find the matching Jira ticket key (for brState keying)
    - Fall back to RL-{rlTaskId} key if no Jira ticket matched
    - Iterate all PM_CHECKLIST items, compute color, track worst
  Overall client color = worst across all bank tasks across all milestones.
  Falls back to 'white' if no bank tasks exist.
*/
function rollupClientStatus(p) {
  if (p.status === 'Live')    return 'green';
  if (p.status === 'On Hold') return 'orange';

  const bankEntries = Object.entries(p.bankReadinessMap || {});
  if (!bankEntries.length) return 'white';

  let hasRed    = false;
  let hasOrange = false;
  let allDone   = true;   // goes false the moment any item is not checked

  for (const [bankName, entry] of bankEntries) {
    const { rlTaskId, taskStart, items } = entry;

    // Determine which key prefix to use for brState lookups:
    // prefer the matched Jira ticket key; fall back to RL-{rlTaskId}
    let ticketKey = null;
    if (p.tickets && p.tickets.length) {
      const bankNameLower = bankName.toLowerCase();
      const matched = p.tickets.find(t => {
        const intName = (extractIntName(t.summary) || t.summary).toLowerCase();
        return intName.includes(bankNameLower) ||
               bankNameLower.includes(intName) ||
               fuzzyBankMatch(bankName, t.summary);
      });
      if (matched) ticketKey = matched.key;
    }
    const stateKey = ticketKey || `RL-${rlTaskId}`;

    for (const pmItem of PM_CHECKLIST) {
      const rlMatch = items.find(it => {
        const n  = (it.name || '').toLowerCase();
        const p2 = (pmItem.name || '').toLowerCase();
        return n === p2 || n.includes(p2.slice(0,12)) || p2.includes(n.slice(0,12));
      });
      const rlDone  = rlMatch && (rlMatch.rlStatus || '').toLowerCase().includes('complet');
      const manDone = !rlDone && brState[`${stateKey}__${pmItem.id}`] === true;
      const isDone  = rlDone || manDone;

      if (!isDone) allDone = false;  // at least one item unchecked

      const rawColor = computePMItemStatus(pmItem, taskStart, p.goLive, isDone);
      const color    = rawColor === 'blocker' ? 'red' : rawColor;
      if (color === 'red')    hasRed    = true;
      if (color === 'orange') hasOrange = true;
    }
  }

  // Priority: Red > Orange > White (neutral/not yet due) > Green (all done)
  // Green ONLY when every single PM item across all bank tasks is checked
  if (hasRed)    return 'red';
  if (hasOrange) return 'orange';
  if (allDone)   return 'green';
  return 'white';   // some items unchecked but none are overdue yet
}

/* Helper: rough fuzzy bank name match between an RL bank task name and a Jira summary */
function fuzzyBankMatch(rlName, jiraSummary) {
  const r = rlName.toLowerCase().replace(/[^a-z0-9]/g, ' ').trim();
  const j = jiraSummary.toLowerCase();
  const words = r.split(/\s+/).filter(w => w.length > 3);
  return words.length > 0 && words.some(w => j.includes(w));
}

/* Legacy helper kept for days-badge coloring in the table rows */
function computeStatusColor(status, daysToGL) {
  if (status === 'Live')    return 'green';
  if (status === 'On Hold') return 'orange';
  if (daysToGL < 0)         return 'red';
  if (daysToGL <= 7)        return 'red';
  if (daysToGL <= 14)       return 'orange';
  return 'white';
}

function computeMilestoneStatus(m, goLiveDate, projectStatus) {
  if (projectStatus === 'Live') return 'green';
  const today = new Date(); today.setHours(0,0,0,0);
  const due = parseLocalDate(goLiveDate);
  due.setDate(due.getDate() + m.daysOffset);
  const daysOver = Math.ceil((today - due) / 86400000);
  if (daysOver >= m.redAt)    return 'red';
  if (daysOver >= m.orangeAt) return 'orange';
  if (daysOver > 0)           return 'orange';
  return 'white';
}

/* ══ JIRA MATCHING ══
   Naming convention is NOT consistent across PMs. Three observed patterns:
     1. CompanyID field:  "TPAM - 6/1 - Zego"
     2. Full client name: "Cardinal Management Group - 6/1/26 - WAB"
     3. Custom word-prefix abbreviation: "calcomm - 6/1 - ..."
        where "calcomm" = "cal"(ifornia) + "comm"(unities)

   Strategy 4 handles pattern 3 by generating all possible word-prefix
   combinations from the client name and checking for a match. */
function jiraClientCode(summary) {
  const seg = (summary.split(/\s*[-–]\s*/)[0] || '').trim().toLowerCase();
  // Strip trailing date patterns like "6/1/2026", "6/1/26", "6/1", "6-1-2026"
  // These appear when a PM omits the dash separator between client code and date
  return seg.replace(/\s*\d{1,2}[\/\-]\d{1,2}(?:[\/\-]\d{2,4})?\s*$/, '').trim() || seg;
}

/* Build every possible abbreviation of a company name using variable
   prefix lengths (1-6 chars) per word. Returns a Set of candidates. */
function nameAbbreviations(name) {
  const words = name.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w => w.length > 0);
  const set = new Set();
  // Uniform prefix lengths
  for (let p = 1; p <= 6; p++) {
    set.add(words.map(w => w.slice(0, p)).join(''));
  }
  // Mixed prefix lengths for 2-word names (most common case)
  if (words.length === 2) {
    for (let a = 1; a <= 7; a++) {
      for (let b = 1; b <= 7; b++) {
        set.add(words[0].slice(0,a) + words[1].slice(0,b));
      }
    }
  }
  // Mixed prefix lengths for 3-word names
  if (words.length === 3) {
    for (let a = 1; a <= 5; a++) {
      for (let b = 1; b <= 5; b++) {
        for (let c = 1; c <= 5; c++) {
          set.add(words[0].slice(0,a) + words[1].slice(0,b) + words[2].slice(0,c));
        }
      }
    }
  }
  return set;
}

function matchesClient(ticket, client) {
  const jRaw  = jiraClientCode(ticket.summary);
  const jNorm = jRaw.replace(/[^a-z0-9]/g, '');

  // Strategy 1 — Exact CompanyID match (e.g. "tpam" === "tpam")
  if (client.companyId && jNorm === client.companyId) return true;

  // Strategy 2 — Normalized full company name match
  const cNorm = (client.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (cNorm.length > 4 && jNorm === cNorm) return true;

  // Strategy 3 — Prefix match for slight truncation
  if (cNorm.length > 6 && jNorm.length > 4) {
    if (cNorm.startsWith(jNorm) || jNorm.startsWith(cNorm)) return true;
  }

  // Strategy 4 — Word-prefix abbreviation match
  // e.g. "calcomm" = "cal"(ifornia) + "comm"(unities)
  if (jNorm.length >= 4) {
    const abbrevs = nameAbbreviations(client.name || '');
    if (abbrevs.has(jNorm)) return true;
  }

  // Strategy 5 — First-word match (for summaries with no dashes at all,
  // or where the date was embedded in the first segment).
  // After stripping the date, try just the first word of jRaw.
  // e.g. "EnProVera OZK Bank" → firstWord = "enprovera" matches companyId "enprovera"
  const firstWord = jRaw.split(/\s+/)[0].replace(/[^a-z0-9]/g, '');
  if (firstWord.length >= 4) {
    if (client.companyId && firstWord === client.companyId) return true;
    if (cNorm.length > 4 && firstWord === cNorm) return true;
    const abbrevs5 = nameAbbreviations(client.name || '');
    if (abbrevs5.has(firstWord)) return true;
  }

  // Strategy 6 — Reporter display name matches a PM on this Rocketlane project.
  if (ticket.reporterName && client.pmMembers && client.pmMembers.length > 0) {
    const rName = ticket.reporterName.toLowerCase().replace(/\s+/g, '');
    const pmNames = new Set(client.pmMembers.map(m => (m.name || '').toLowerCase().replace(/\s+/g, '')));
    if (pmNames.has(rName)) {
      const summaryParts = ticket.summary.split(/\s*[-–]\s*/);
      const checkPart = summaryParts.length >= 3
        ? summaryParts.slice(2).join(' ')
        : ticket.summary;
      const checkNorm   = checkPart.toLowerCase().replace(/[^a-z0-9\s]/g, '');
      const clientWords = (client.name || '').toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(w => w.length >= 4);
      if (clientWords.some(w => checkNorm.includes(w))) return true;
    }
  }

  return false;
}

/* Match a Jira ticket to a specific integration by name.
   Jira summary format: "ClientCode – GoLiveDate – IntegrationName"
   RL name format:      "Alliance Bank (Banking)", "HomeWise (Closings)", etc.
*/
function matchesIntegration(ticket, rlIntName) {
  // Extract everything after the 2nd dash segment as the integration hint
  const parts = ticket.summary.split(/\s*[-–]\s*/);
  const jiraHint = parts.slice(2).join(' ').toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
  if (!jiraHint) return false;

  // Strip parenthetical from RL name: "HomeWise (Closings)" → "HomeWise"
  const rlBase  = rlIntName.replace(/\s*\(.*?\)/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,'').trim();
  const rlWords = rlBase.split(/\s+/).filter(w => w.length > 2);

  return rlWords.some(w => jiraHint.includes(w)) || jiraHint.includes(rlBase);
}

function isStale(ticket) {
  const active = ['In Progress','In Review','To Do','Needs Testing','Waiting for Partner','Waiting for support'];
  if (!active.includes(ticket.statusName)) return false;
  return Math.floor((Date.now() - new Date(ticket.updated)) / 86400000) >= 7;
}

function jiraStatusClass(name) {
  const n = (name||'').toLowerCase();
  if (n.includes('progress'))  return 'inprogress';
  if (n.includes('review'))    return 'inreview';
  if (n.includes('testing') || n.includes('needs test')) return 'needstesting';
  if (n.includes('waiting'))   return 'waiting';
  if (n.includes('validation'))return 'validation';
  if (n.includes('done'))      return 'done';
  return 'todo';
}

function isBankTicket(summary) {
  const lower = summary.toLowerCase();
  if (lower.includes('(banking)') || lower.includes('banking')) return true;
  const intName = extractIntName(summary).toLowerCase();
  return BANK_KEYWORDS.some(kw => intName.includes(kw));
}

/* Extract the integration / bank name from a Jira ticket summary.
   Naming convention: "ClientCode – Date – IntegrationName"
   Falls back gracefully for non-standard formats. */
function extractIntName(summary) {
  const parts = summary.split(/\s*[-–]\s*/);
  if (parts.length >= 3) {
    return parts.slice(2).join(' – ').replace(/\s*\([^)]+\)\s*$/, '').trim();
  }
  if (parts.length === 2) {
    return parts[1].replace(/\s*\d+[\/\-]\d+(?:[\/\-]\d+)?\s*$/, '').trim() || parts[1].trim();
  }
  // No dashes: drop first word (client code) and trailing date
  const stripped = summary.replace(/\s*\d+[\/\-]\d+(?:[\/\-]\d+)?\s*$/, '').trim();
  const words = stripped.split(/\s+/);
  return words.slice(1).join(' ') || summary;
}

/* Parse ADF (Atlassian Document Format) to plain text for comment searching */
function adfToText(node) {
  if (!node) return '';
  if (typeof node === 'string') return node;
  if (node.type === 'text') return node.text || '';
  if (Array.isArray(node.content)) return node.content.map(adfToText).join('');
  if (node.content) return adfToText(node.content);
  return '';
}

/* Jira Automation posts one of these tags as a comment when the INT team
   checks the corresponding checklist item. Dashboard reads them on refresh
   and auto-checks the matching INT milestone. No Jira write from our side. */
const JIRA_AUTO_TAGS = {
  '[INT-CREDS-DONE]':   5,  // Enter Parameter Values → Credentials Received
  '[INT-TESTING-DONE]': 6,  // Test Credentials       → Testing Complete
  '[INT-READY-GL]':     8,  // Update ACH ID's        → Ready for Go-Live
  '[INT-POST-GL]':      9,  // Check for ACH Draft    → Post Go-Live Testing Completed
};

// All system tags — hidden from the activity feed
const SYSTEM_TAGS = ['[INT-NOTE]', '[INT-CREDS-DONE]', '[INT-TESTING-DONE]', '[INT-READY-GL]', '[INT-POST-GL]'];

/* After fetching all Jira issues (with comment field), scan every comment for:
   - [INT-AUTO] tags posted by Jira Automation → auto-check INT milestones
   - [INT-NOTE] tags → sync running notes into localStorage */
function parseMilestoneComments(issues) {
  const NOTE_TAG = /\[INT-NOTE\]\s*(\{[^\n]+\})/;

  // Collect notes in a temp map first (keyed by projectId → Set of "at" timestamps
  // already seen) to avoid duplicating notes already in localStorage.
  const seenNotes = {}; // { projectId: Set<at> }
  for (const pid in notesState) {
    seenNotes[pid] = new Set((notesState[pid] || []).map(n => n.at));
  }

  for (const iss of issues) {
    const comments = iss.fields?.comment?.comments || [];
    for (const c of comments) {
      const raw         = typeof c.body === 'string' ? c.body : adfToText(c.body);
      const commentDate = c.updated || c.created || new Date().toISOString();

      // ── Jira Automation INT milestone auto-tags ──────────────────────────
      for (const [tag, step] of Object.entries(JIRA_AUTO_TAGS)) {
        if (raw.includes(tag)) {
          const key      = getMilestoneKey(iss.key, step);
          const existing = milestoneState[key];
          // Jira comment is authoritative — set if newer or not yet set
          if (!existing?.at || new Date(commentDate) >= new Date(existing.at)) {
            milestoneState[key] = { completed: true, by: 'Jira Auto', at: commentDate };
          }
        }
      }

      // ── Running notes ────────────────────────────────────────────────────
      const noteMatch = raw.match(NOTE_TAG);
      if (noteMatch) {
        try {
          const data = JSON.parse(noteMatch[1]);
          const pid  = String(data.rl);
          if (!seenNotes[pid]) seenNotes[pid] = new Set();
          if (data.at && !seenNotes[pid].has(data.at)) {
            if (!notesState[pid]) notesState[pid] = [];
            notesState[pid].push({ text: data.text || '', by: data.by || 'Team', at: data.at });
            seenNotes[pid].add(data.at);
          }
        } catch(e) {}
      }
    }
  }

  // Sort each project's notes chronologically
  for (const pid in notesState) {
    notesState[pid].sort((a, b) => new Date(a.at) - new Date(b.at));
  }

  saveMilestoneState();
  saveNotesState();
}

/* Write a structured Jira comment so other dashboard users see the check on refresh.
   Uses "tk" (ticket key) as the identifier — written directly to that INT ticket. */
async function writeMilestoneComment(ticketKey, step, milestoneName, state) {
  const verb = state.completed ? '✅ Marked complete' : '⬜ Marked incomplete';
  const dt   = new Date(state.at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const tag  = JSON.stringify({ tk: ticketKey, s: step, done: state.completed, by: state.by, at: state.at, m: milestoneName });
  const body = `${verb}: Step ${step} – ${milestoneName}\nBy ${state.by} on ${dt}\n\n[INT-DASHBOARD] ${tag}`;
  await callMcp(JIRA_COMMENT_TOOL, {
    cloudId:       JIRA_CLOUD,
    issueIdOrKey:  ticketKey,
    body:          body,
    contentFormat: 'markdown',
  });
}

/* Toggle a milestone for a specific integration ticket.
   ticketKey is both the state key AND the Jira ticket to write the comment to. */
async function toggleMilestone(ticketKey, step, milestoneName) {
  const key        = getMilestoneKey(ticketKey, step);
  const wasChecked = milestoneState[key]?.completed === true;
  const newState   = { completed: !wasChecked, by: currentUserName, at: new Date().toISOString() };
  milestoneState[key] = newState;
  saveMilestoneState();

  // Safe ID — ticket keys contain hyphens which are valid in HTML IDs
  const safeId = ticketKey.replace(/[^a-zA-Z0-9-]/g, '');
  const el = document.getElementById(`ms-${safeId}-${step}`);
  if (el) applyMilestoneDOM(el, ticketKey, step, milestoneName, newState);
  // State is persisted to localStorage only — no Jira comment written for checkbox toggles
}

/* Apply visual state to a milestone DOM element without re-rendering the row */
function applyMilestoneDOM(el, ticketKey, step, milestoneName, state) {
  const isChecked = state?.completed === true;
  const m = MILESTONES.find(x => x.step === step);
  // Find the project that owns this ticket so we can compute deadline colors
  const p = allProjects.find(x => x.tickets.some(t => t.key === ticketKey));

  // Outer item color
  el.classList.remove('green','orange','red','white','done-manual');
  if (isChecked) {
    el.classList.add('green','done-manual');
  } else if (p && m) {
    el.classList.add(computeMilestoneStatus(m, p.goLiveDate, p.status));
  }

  // Checkbox
  const cb = el.querySelector('.m-checkbox');
  if (cb) {
    cb.classList.toggle('checked', isChecked);
    cb.innerHTML = isChecked ? '✓' : '';
    cb.title = isChecked ? 'Click to uncheck' : 'Click to mark complete';
  }

  // Badge
  const badge = el.querySelector('.m-badge');
  if (badge) {
    if (isChecked) {
      badge.className = 'm-badge green';
      badge.textContent = '✓ Complete';
    } else if (p && m) {
      const col = computeMilestoneStatus(m, p.goLiveDate, p.status);
      const due = parseLocalDate(p.goLive); due.setDate(due.getDate() + m.daysOffset);
      const ds  = due.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      badge.className = `m-badge ${col}`;
      badge.textContent = { green:'✓ On Track', orange:'⚠ Due Soon', red:'✗ Overdue', white:`Due ${ds}` }[col];
    }
  }

  // "Completed by" line
  const content = el.querySelector('.m-content');
  if (content) {
    let byEl = content.querySelector('.m-completedby');
    if (isChecked && state) {
      const dt = new Date(state.at).toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const html = `<div class="m-completedby">✓ ${escHtml(state.by || 'Team')} · ${dt}</div>`;
      if (byEl) byEl.outerHTML = html;
      else content.insertAdjacentHTML('beforeend', html);
    } else if (byEl) {
      byEl.remove();
    }
  }
}

/* ══ PM BANK READINESS TOGGLE ══
   Keyed per Jira ticket (ticketKey) so that multiple banks on the same
   project each get independent checklist state. */
function toggleBRItem(ticketKey, subtaskId) {
  const key        = `${ticketKey}__${subtaskId}`;
  const wasChecked = brState[key] === true;
  brState[key]     = !wasChecked;
  saveBRState();

  // Sanitize ticket key for safe DOM IDs (hyphens are valid in IDs)
  const safeKey = ticketKey.replace(/[^a-zA-Z0-9-]/g, '');

  // Update DOM without full re-render
  const rowEl = document.getElementById(`br-row-${safeKey}-${subtaskId}`);
  const cbEl  = document.getElementById(`br-cb-${safeKey}-${subtaskId}`);
  const bgEl  = document.getElementById(`br-badge-${safeKey}-${subtaskId}`);
  if (rowEl) {
    rowEl.classList.toggle('done-manual', !wasChecked);
  }
  if (cbEl) {
    cbEl.classList.toggle('checked', !wasChecked);
    cbEl.textContent = !wasChecked ? '✓' : '';
  }
  if (bgEl) {
    if (!wasChecked) {
      bgEl.className = 'm-badge green';
      bgEl.textContent = 'Manual ✓';
    } else {
      bgEl.className = 'm-badge white';
      bgEl.textContent = 'Pending';
    }
  }
  // Update PM checklist count label in this bank card's section header
  const countEl = document.getElementById(`br-count-${safeKey}`);
  if (countEl) {
    const done = PM_CHECKLIST.filter(item => brState[`${ticketKey}__${item.id}`] === true).length;
    countEl.textContent = `${done}/${PM_CHECKLIST.length}`;
  }

  // Re-compute this project's status dot and update it in the table without full re-render
  // Find project by matching ticket key (for Jira-keyed banks) or RL key prefix (for RL-only)
  const proj = allProjects.find(p =>
    p.tickets.some(t => t.key === ticketKey) ||
    Object.values(p.bankReadinessMap || {}).some(e => `RL-${e.rlTaskId}` === ticketKey)
  );
  if (proj) {
    proj.statusColor = rollupClientStatus(proj);
    const dotEl = document.querySelector(`#row-${proj.id} .status-dot`);
    if (dotEl) {
      dotEl.className = `status-dot ${proj.statusColor}`;
    }
    updateStats();
  }
}
