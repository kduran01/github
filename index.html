/* Write a Jira comment encoding the note so other dashboard users see it on refresh */
async function writeNoteComment(ticketKey, projectId, note) {
  const dt  = new Date(note.at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
  const tag = JSON.stringify({ rl: projectId, text: note.text, by: note.by, at: note.at });
  const body = `📝 **Note** by ${note.by} on ${dt}:\n\n${note.text}\n\n[INT-NOTE] ${tag}`;
  await callMcp(JIRA_COMMENT_TOOL, {
    cloudId:       JIRA_CLOUD,
    issueIdOrKey:  ticketKey,
    body:          body,
    contentFormat: 'markdown',
  });
}

/* Re-render just the notes list inside a DOM element (avoids full row re-render) */
function renderNotesInDOM(projectId) {
  const listEl = document.getElementById(`notes-list-${projectId}`);
  const countEl = document.getElementById(`notes-count-${projectId}`);
  const notes   = notesState[projectId] || [];
  if (countEl) countEl.textContent = `${notes.length} note${notes.length !== 1 ? 's' : ''}`;
  if (!listEl) return;
  if (!notes.length) {
    listEl.innerHTML = `<div class="notes-empty">No notes yet — add the first one below.</div>`;
    return;
  }
  listEl.innerHTML = notes.map(n => {
    const dt = new Date(n.at).toLocaleString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
    return `<div class="note-item">
      <div class="note-meta">📝 ${escHtml(n.by)} &nbsp;·&nbsp; ${dt}</div>
      <div class="note-text">${escHtml(n.text)}</div>
    </div>`;
  }).join('');
  listEl.scrollTop = listEl.scrollHeight;
}

/* Add a new note: save locally, update DOM, then write to Jira in background */
async function addNote(projectId, primaryTicketKey) {
  const ta  = document.getElementById(`note-ta-${projectId}`);
  const btn = document.getElementById(`note-btn-${projectId}`);
  const st  = document.getElementById(`note-st-${projectId}`);

  const text = (ta?.value || '').trim();
  if (!text) { ta?.focus(); return; }

  btn.disabled = true; btn.textContent = 'Saving…';

  const note = { text, by: currentUserName, at: new Date().toISOString() };
  if (!notesState[projectId]) notesState[projectId] = [];
  notesState[projectId].push(note);
  saveNotesState();

  ta.value = '';
  ta.style.height = '';
  renderNotesInDOM(projectId);

  if (primaryTicketKey) {
    try {
      await writeNoteComment(primaryTicketKey, projectId, note);
      if (st) { st.textContent = '✓ Saved to Jira'; setTimeout(() => { if (st) st.textContent = ''; }, 2500); }
    } catch(e) {
      if (st) { st.textContent = '⚠ Saved locally (Jira write failed)'; st.style.color = '#92400e'; setTimeout(() => { if (st) { st.textContent = ''; st.style.color = ''; } }, 3500); }
    }
  } else {
    if (st) { st.textContent = '✓ Saved locally'; setTimeout(() => { if (st) st.textContent = ''; }, 2500); }
  }

  btn.disabled = false; btn.textContent = 'Add Note';
  ta?.focus();
}

/* ══ DATA LOADING ══ */
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '↻ Loading…';
  expandedRows.clear();
  updateStatusBar('loading');
  loadLocalMilestoneState();
  loadLocalNotesState();
  loadLocalBRState();
  loadCurrentUser(); // async — resolves display name from Jira /myself
  document.getElementById('tableBody').innerHTML = `
    <tr><td colspan="10"><div class="loading-state">
      <div class="loading-spinner"></div>
      <div id="loadingMsg">Loading Rocketlane data…</div>
    </div></td></tr>`;

  // ── Build project model from baked-in Rocketlane data ────────
  const projRows  = LIVE_RL_DATA.projects;
  const teamRows  = LIVE_RL_DATA.teamRows;
  const brMap     = LIVE_RL_DATA.brMap;

  // Build team map
  const teamMap = {};
  teamRows.forEach(m => {
    const pid   = String(m.project_id);
    const email = (m.email_id || '').toLowerCase().trim();
    const name  = [m.first_name, m.last_name].filter(Boolean).join(' ')
                  || email.split('@')[0].replace(/\./g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    if (!teamMap[pid]) teamMap[pid] = [];
    teamMap[pid].push({ name, email, isPm: PM_EMAILS.has(email), isInt: INT_EMAILS.has(email) });
  });

  const today = new Date(); today.setHours(0,0,0,0);
  allProjects = projRows.map(p => {
    const pid    = String(p.id);
    const team   = teamMap[pid] || [];
    const pms    = team.filter(m => m.isPm);
    const ints   = team.filter(m => m.isInt);
    const goLive   = parseLocalDate(p.go_live_date);
    const daysToGL = Math.ceil((goLive - today) / 86400000);
    return {
      id: pid,
      name: p.customer_company_name || p.name,
      projectName: p.name,
      companyId: (p.company_id || '').toLowerCase().replace(/[^a-z0-9]/g, '').trim(),
      goLive: p.go_live_date,
      goLiveDate: goLive,
      daysToGL,
      status: p.status_label || '—',
      progress: p.pre_gl_total > 0
        ? Math.round((p.pre_gl_done / p.pre_gl_total) * 100)
        : (parseFloat(p.progress_percentage) || 0),
      preGlTotal: parseInt(p.pre_gl_total) || 0,
      preGlDone:  parseInt(p.pre_gl_done)  || 0,
      pm: pms[0]?.name || '—',
      pmMembers: pms,
      intMembers: ints,
      tickets: [],
      bankReadinessMap: brMap[pid] || {},
      statusColor: 'white',
    };
  });

  allProjects.forEach(p => { p.statusColor = rollupClientStatus(p); });

  initMonthTabs();
  updateStats();
  renderTable();
  const d = new Date(LIVE_RL_DATA.generatedAt + 'T00:00:00');
  const dateStr = d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  document.getElementById('lastUpdated').textContent = `RL as of ${dateStr}`;
  updateStatusBar('partial', null, null);
  btn.disabled = false; btn.textContent = '↻ Refresh';

  loadJira();
}

async function loadJira() {
  jiraLoaded = false; jiraError = null;
  try {
    let allIssues = [];
    let nextPageToken = undefined;
    const MAX_PAGES = 25;
    for (let page = 0; page < MAX_PAGES; page++) {
      const params = {
        cloudId:    JIRA_CLOUD,
        jql:        'project = "INT" AND (status not in (Done, Cancelled, Canceled) OR (summary ~ "API Agreement Form" OR summary ~ "Signed API Form" OR summary ~ "api form") AND created >= "2025-01-01") ORDER BY created DESC',
        fields:     ['summary','status','assignee','reporter','updated','created','comment'],
        maxResults: 100,
      };
      if (nextPageToken) params.nextPageToken = nextPageToken;
      const raw    = await callMcp(JIRA_TOOL, params, 30000);
      const result = unwrap(raw);
      const pageIssues = Array.isArray(result?.issues)        ? result.issues
                       : Array.isArray(result?.result?.issues) ? result.result.issues
                       : [];
      allIssues = allIssues.concat(pageIssues);
      if (result?.isLast === true || !result?.nextPageToken) break;
      nextPageToken = result.nextPageToken;
    }
    parseMilestoneComments(allIssues);
    jiraTickets = allIssues.map(iss => {
      const f  = iss.fields || {};
      const st = (f.status || {}).name || '—';
      const rawComments = (f.comment?.comments || []);
      const visibleComments = rawComments
        .map(c => ({
          author: c.author?.displayName || c.updateAuthor?.displayName || 'Unknown',
          body:   typeof c.body === 'string' ? c.body : adfToText(c.body),
          date:   (c.updated || c.created || '').slice(0, 10),
        }))
        .filter(c => !SYSTEM_TAGS.some(tag => c.body.includes(tag)))
        .slice(-5);
      return {
        key:           iss.key,
        summary:       f.summary || '',
        statusName:    st,
        statusCls:     jiraStatusClass(st),
        assignee:      (f.assignee  || {}).displayName  || 'Unassigned',
        reporterEmail: ((f.reporter || {}).emailAddress || '').toLowerCase().trim(),
        reporterName:  (f.reporter  || {}).displayName  || '',
        updated:       (f.updated || '').slice(0,10),
        created:       (f.created || '').slice(0,10),
        url:           JIRA_BASE + iss.key,
        comments:      visibleComments,
      };
    });
    allProjects.forEach(p => {
      p.tickets = jiraTickets.filter(t => matchesClient(t, p));
      p.statusColor = rollupClientStatus(p);
    });
    jiraLoaded = true;
    updateStats();
    renderTable();
    document.getElementById('lastUpdated').textContent =
      `Updated ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    updateStatusBar('ok', null, null);

  } catch(e) {
    jiraError  = e?.message || String(e);
    jiraLoaded = true;
    jiraTickets = [];
    updateStatusBar('warn', null, jiraError);
  }
}

/* ══ STATUS BAR ══ */
function updateStatusBar(state, rlErr, jiraErr) {
  const bar = document.getElementById('dataStatusBar');
  bar.style.display = 'flex';
  if (state === 'loading') {
    bar.className = 'data-status-bar warn';
    bar.innerHTML = '<span class="source-badge loading">Rocketlane</span> Fetching… <span class="source-badge loading">Jira</span> Pending…';
  } else if (state === 'partial') {
    bar.className = 'data-status-bar warn';
    bar.innerHTML = `<span class="source-badge ok">Rocketlane ✓</span> ${allProjects.length} clients loaded${rlErr?` — ⚠ ${escHtml(rlErr)}`:''}  &nbsp;·&nbsp; <span class="source-badge loading">Jira</span> Loading tickets…`;
  } else if (state === 'ok') {
    bar.className = 'data-status-bar ok';
    bar.innerHTML = `<span class="source-badge ok">Rocketlane ✓</span> Live data &nbsp;·&nbsp; <span class="source-badge ok">Jira ✓</span> ${jiraTickets.length} active INT tickets`;
  } else if (state === 'warn') {
    bar.className = 'data-status-bar warn';
    bar.innerHTML = `<span class="source-badge ok">Rocketlane ✓</span> Live data &nbsp;·&nbsp; <span class="source-badge err">Jira ✗</span> ${escHtml(jiraErr || 'Could not load tickets')}`;
  } else {
    bar.className = 'data-status-bar err';
    bar.innerHTML = `<span class="source-badge err">Rocketlane ✗</span> ${escHtml(rlErr || 'Failed to load')}`;
  }
}

/* ══ CONTROLS ══ */
function setMonth(m) {
  activeMonth = m;
  document.querySelectorAll('.month-tab').forEach(t => t.classList.remove('active'));
  const idMap = { all:'tabBoth', m1:'tabM1', m2:'tabM2', m3:'tabM3' };
  if (idMap[m]) document.getElementById(idMap[m]).classList.add('active');
  expandedRows.clear(); renderTable();
}

function initMonthTabs() {
  const sub = document.getElementById('dashSubtitle');
  if (sub) sub.textContent = `${MONTH1_SHORT} – ${MONTH3_SHORT} ${MONTH1_YEAR === MONTH3_YEAR ? MONTH1_YEAR : MONTH1_YEAR + '/' + MONTH3_YEAR} · Vantaca Implementations`;
  const t1 = document.getElementById('tabM1');
  const t2 = document.getElementById('tabM2');
  const t3 = document.getElementById('tabM3');
  if (t1) { t1.textContent = MONTH1_LABEL; t1.style.display = ''; }
  if (t2) { t2.textContent = MONTH2_LABEL; t2.style.display = ''; }
  if (t3) { t3.textContent = MONTH3_LABEL; t3.style.display = ''; }
}

function sortBy(field) {
  if (sortField === field) sortAsc = !sortAsc; else { sortField = field; sortAsc = true; }
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted');
    if (th.id) th.textContent = th.textContent.replace(/[↑↓↕]/g,'').trim() + ' ↕';
  });
  const thEl = document.getElementById('th-' + field);
  if (thEl) { thEl.classList.add('sorted'); thEl.textContent = thEl.textContent.replace(/[↑↓↕]/g,'').trim() + ' ' + (sortAsc?'↑':'↓'); }
  renderTable();
}

function getFiltered() {
  const search  = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const statusF = document.getElementById('statusFilter')?.value||'';
  const riskF   = document.getElementById('riskFilter')?.value||'';
  return allProjects.filter(p => {
    if (activeMonth === 'm1' && parseLocalDate(p.goLive).getMonth()+1 !== MONTH1_NUM) return false;
    if (activeMonth === 'm2' && parseLocalDate(p.goLive).getMonth()+1 !== MONTH2_NUM) return false;
    if (activeMonth === 'm3' && parseLocalDate(p.goLive).getMonth()+1 !== MONTH3_NUM) return false;
    if (search && !p.name.toLowerCase().includes(search) && !p.pm.toLowerCase().includes(search)) return false;
    if (statusF && p.status !== statusF) return false;
    if (riskF   && p.statusColor !== riskF) return false;
    return true;
  }).sort((a,b) => {
    let va, vb;
    switch(sortField) {
      case 'client':   va=a.name;       vb=b.name;       break;
      case 'goLive':   va=a.goLive;     vb=b.goLive;     break;
      case 'days':     va=a.daysToGL;   vb=b.daysToGL;   break;
      case 'pm':       va=a.pm;         vb=b.pm;         break;
      case 'int':      va=a.intMembers[0]?.name||''; vb=b.intMembers[0]?.name||''; break;
      case 'tickets':  va=a.tickets.length; vb=b.tickets.length; break;
      case 'rlStatus': va=a.status;     vb=b.status;     break;
      case 'progress': va=a.progress;   vb=b.progress;   break;
      default:         va=a.goLive;     vb=b.goLive;
    }
    if(va<vb) return sortAsc?-1:1; if(va>vb) return sortAsc?1:-1; return 0;
  });
}

/* ══ RENDER ══ */
function renderTable() {
  const projects = getFiltered();
  const tbody = document.getElementById('tableBody');
  if (!projects.length) {
    tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state">No clients match the current filters.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = projects.flatMap(p => {
    const exp      = expandedRows.has(p.id);
    const glStr    = parseLocalDate(p.goLive).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const pct      = Math.round(p.progress);
    // pacing.expectedPct placeholder — full pacing curve requires project_start (V2 backlog)
    const pacing   = { expectedPct: null };
    // Gradient: blue (0%) → green (90%+)
    // Interpolate RGB between #4f46e5 (blue) and #22c55e (green)
    const t        = Math.min(pct / 90, 1);
    const r        = Math.round(79  + (34  - 79)  * t);
    const g        = Math.round(70  + (197 - 70)  * t);
    const b        = Math.round(229 + (94  - 229) * t);
    const barColor = `rgb(${r},${g},${b})`;
    const intFirst = p.intMembers[0]?.name || (jiraLoaded ? '—' : '…');
    const intExtra = p.intMembers.length > 1 ? `<span style="color:#9ca3af;font-size:10px"> +${p.intMembers.length-1}</span>` : '';

    let daysBadge;
    if (p.status==='Live')   daysBadge = `<span class="days-badge live">✓ Live</span>`;
    else if (p.daysToGL<0)   daysBadge = `<span class="days-badge red">${Math.abs(p.daysToGL)}d overdue</span>`;
    else if (p.daysToGL===0) daysBadge = `<span class="days-badge red">Today!</span>`;
    else { const c = p.statusColor==='red'?'red':p.statusColor==='orange'?'orange':'white'; daysBadge=`<span class="days-badge ${c}">${p.daysToGL}d</span>`; }

    const staleCount = p.tickets.filter(t=>isStale(t)).length;
    let ticketBadge;
    if (!jiraLoaded)            ticketBadge = `<span style="color:#9ca3af;font-size:11px">…</span>`;
    else if (!p.tickets.length) ticketBadge = `<span style="color:#9ca3af;font-size:11px">—</span>`;
    else if (staleCount>0)      ticketBadge = `<span style="font-size:11px;font-weight:600;color:#92400e">⚠ ${p.tickets.length} (${staleCount} stale)</span>`;
    else                        ticketBadge = `<span style="font-size:11px;font-weight:600;color:#4f46e5">🎫 ${p.tickets.length}</span>`;

    const rlPill = `<span style="font-size:11px;padding:2px 8px;border-radius:10px;background:#f3f4f6;color:#374151">${escHtml(p.status)}</span>`;

    const mainRow = `
      <tr class="data-row ${exp?'expanded-row-parent':''}" id="row-${p.id}" onclick="toggleExpand('${p.id}')">
        <td><button class="expand-btn" onclick="event.stopPropagation();toggleExpand('${p.id}')">${exp?'▼':'▶'}</button></td>
        <td><span class="status-dot ${p.statusColor}"></span></td>
        <td style="font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(p.name)}">${escHtml(p.name)}</td>
        <td style="white-space:nowrap;color:#374151">${glStr}</td>
        <td>${daysBadge}</td>
        <td style="color:#374151;white-space:nowrap">${escHtml(p.pm)}</td>
        <td style="color:#374151;white-space:nowrap">${escHtml(intFirst)}${intExtra}</td>
        <td>${ticketBadge}</td>
        <td><div style="display:flex;align-items:center;gap:5px" title="${pct}% complete · Expected ${pacing.expectedPct ?? '?'}% (${p.preGlDone}/${p.preGlTotal} pre-go-live tasks)">
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${barColor}"></div>
          </div>
          <span style="font-size:11px;color:#6b7280;min-width:30px">${pct}%</span>
        </div></td>
      </tr>`;

    const detailRow = `
      <tr class="detail-row ${exp?'open':''}" id="detail-${p.id}">
        <td colspan="10" class="detail-cell">${exp?renderDetail(p):''}</td>
      </tr>`;
    return [mainRow, detailRow];
  }).join('');
}

function renderDetail(p) {
  const glLabel = p.status==='Live' ? '✅ Client is live!' :
    p.daysToGL<0  ? `⚠️ ${Math.abs(p.daysToGL)} days past scheduled go-live` :
    p.daysToGL===0? '🚀 Go-live is TODAY' : `${p.daysToGL} days until go-live`;

  const pmChips  = p.pmMembers.map(m=>`<span class="team-chip pm">PM: ${escHtml(m.name)}</span>`).join('');
  const intChips = p.intMembers.map(m=>`<span class="team-chip int">INT: ${escHtml(m.name)}</span>`).join('');

  // ── Left column: per-bank integration cards ──────────────────────────────────
  let intCardsHtml;
  if (!jiraLoaded) {
    intCardsHtml = `<div class="int-no-tickets">⏳ Loading Jira tickets…</div>`;
  } else if (jiraError) {
    intCardsHtml = `<div class="int-no-tickets">⚠️ Jira unavailable — <a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="color:#4f46e5">Open INT board</a></div>`;
  } else if (!p.tickets.length) {
    intCardsHtml = `<div class="int-no-tickets">🎫 No INT tickets matched to this client.<br><span style="font-size:11px"><a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="color:#4f46e5">Search the INT board →</a></span></div>`;
  } else {
    const bankTickets  = p.tickets.filter(t => isBankTicket(t.summary));
    const nonBankCount = p.tickets.length - bankTickets.length;

    if (!bankTickets.length) {
      // ── Fallback: render RL bank task cards when no Jira tickets are matched ──
      // This covers test projects and clients where Jira tickets haven't been created yet.
      const rlBankEntries = Object.entries(p.bankReadinessMap || {}).filter(([name]) => {
        const n = name.toLowerCase();
        return n.includes('bank') || BANK_KEYWORDS.some(kw => n.includes(kw));
      });

      if (rlBankEntries.length) {
        intCardsHtml = rlBankEntries.map(([bankTaskName, entry]) => {
          // Use "RL-{taskId}" as a stable per-bank key (no Jira ticket)
          const rlKey   = `RL-${entry.rlTaskId}`;
          const safeKey = rlKey.replace(/[^a-zA-Z0-9-]/g, '');
          const rlItems = entry.items || [];
          const rlByNorm2 = {};
          rlItems.forEach(item => { rlByNorm2[normName(item.name)] = item; });

          function findRLMatch2(pmName) {
            const pn = normName(pmName);
            for (const [rn, item] of Object.entries(rlByNorm2)) {
              if (pn.length >= 6 && rn.startsWith(pn.slice(0,6))) return item;
              if (rn.length >= 6 && pn.startsWith(rn.slice(0,6))) return item;
            }
            // Word-level fallback (handles "Bank Notified" ↔ "All Banks Notified")
            const pWords = pn.match(/[a-z]{4,}/g) || [];
            for (const [rn, item] of Object.entries(rlByNorm2)) {
              const rWords = new Set(rn.match(/[a-z]{4,}/g) || []);
              if (pWords.length > 0 && pWords.filter(w => rWords.has(w)).length >= Math.min(2, pWords.length)) return item;
            }
            return null;
          }

          const rlTaskStart2 = entry.taskStart || null;

          function getPMOnTrackDate2(pmItem) {
            const gl = parseLocalDate(p.goLive);
            const ts = rlTaskStart2 ? parseLocalDate(rlTaskStart2) : new Date(gl.getTime() - 60 * 86400000);
            if (pmItem.phase === 3) return new Date(gl.getTime() + pmItem.onTrackCd * 86400000);
            return addBusinessDays(ts, pmItem.onTrackBd);
          }

          const pmDone2 = PM_CHECKLIST.filter(item => {
            const rlMatch = findRLMatch2(item.name);
            const rlDone  = rlMatch && (rlMatch.rlStatus || '').toLowerCase().includes('complet');
            return rlDone || brState[`${rlKey}__${item.id}`] === true;
          }).length;

          const pmRows2 = PM_CHECKLIST.map(pmItem => {
            const rlMatch     = findRLMatch2(pmItem.name);
            const rlDone      = rlMatch && (rlMatch.rlStatus || '').toLowerCase().includes('complet');
            const manKey      = `${rlKey}__${pmItem.id}`;
            const manDone     = !rlDone && brState[manKey] === true;
            const isDone      = rlDone || manDone;
            const autoColor   = computePMItemStatus(pmItem, rlTaskStart2, p.goLive, isDone);
            const dispColor   = autoColor === 'blocker' ? 'red' : autoColor;
            const isBlocker   = autoColor === 'blocker' && !isDone;
            const onTrackDate = getPMOnTrackDate2(pmItem);
            const onTrackStr  = onTrackDate.toLocaleDateString('en-US', { month:'short', day:'numeric' });

            const onclickStr = rlDone
              ? `style="cursor:default" title="Completed in Rocketlane — read-only"`
              : `onclick="toggleBRItem('${rlKey}','${pmItem.id}')" title="Click to toggle"`;
            const metaLabel = isDone
              ? (rlDone ? '<span style="color:#16a34a">✓ Rocketlane</span>' : '<span style="color:#4f46e5">✓ Manual</span>')
              : `PM · on track by ${onTrackStr}`;
            const badgeText = isDone
              ? (rlDone ? 'RL ✓' : 'Manual ✓')
              : isBlocker ? '🚨 Blocker'
              : { red:'✗ Overdue', orange:'⚠ At Risk', green:'✓ On Track', white:`Due ${onTrackStr}` }[dispColor] || `Due ${onTrackStr}`;

            return `<div class="milestone-item ${isDone?'done-manual':isBlocker?'blocker':dispColor}" id="br-row-${safeKey}-${pmItem.id}">
              <div class="m-checkbox${isDone?' checked':''}" id="br-cb-${safeKey}-${pmItem.id}" ${onclickStr}>${isDone?'✓':''}</div>
              <div class="m-content">
                <div class="m-name">${escHtml(pmItem.name)}</div>
                <div class="m-meta">${metaLabel}</div>
              </div>
              <span class="m-badge ${isDone?'green':dispColor}" id="br-badge-${safeKey}-${pmItem.id}">${badgeText}</span>
            </div>`;
          }).join('');

          // ── API Form Complete for fallback cards ──
          const apiFormTicketFb = findJiraApiForm(p);
          const apiFormJiraFb   = !!apiFormTicketFb;
          const apiFormManualFb = !apiFormJiraFb && brState[`${rlKey}__api-form`] === true;
          const apiFormDoneFb   = apiFormJiraFb || apiFormManualFb;
          const apiFormHtmlFb   = `<div class="checklist-section-header" style="background:#ecfdf5;color:#065f46;border-top:2px solid #d1fae5;margin-top:2px">API Form</div>
            <div class="int-card-milestones">
              <div class="milestone-item ${apiFormDoneFb?'green done-manual':'white'}" id="br-row-${safeKey}-api-form">
                <div class="m-checkbox${apiFormDoneFb?' checked':''}" id="br-cb-${safeKey}-api-form"
                     ${apiFormJiraFb ? 'style="cursor:default" title="Auto-detected: API form found in Jira"'
                                     : `onclick="toggleBRItem('${escHtml(rlKey)}','api-form')" title="${apiFormManualFb?'Click to uncheck':'Click to mark complete'}"`}>
                  ${apiFormDoneFb?'✓':''}
                </div>
                <div class="m-content">
                  <div class="m-name">API Form Complete</div>
                  <div class="m-meta">${apiFormJiraFb
                    ? `<a href="${escHtml(apiFormTicketFb.url)}" target="_blank" style="color:#4f46e5">${escHtml(apiFormTicketFb.key)} ↗</a>`
                    : `<span style="color:#6b7280">Required before go-live</span>`}</div>
                </div>
                <span class="m-badge ${apiFormDoneFb?'green':'white'}" id="br-badge-${safeKey}-api-form">${apiFormJiraFb ? '✓ Jira' : (apiFormManualFb ? 'Manual ✓' : 'Pending')}</span>
              </div>
            </div>`;

          // ── INT Checklist for fallback cards (no Jira ticket yet) ──
          const intStepsFb = MILESTONES.filter(m => m.step >= 5 && m.step <= 9);
          const intRowsFb  = intStepsFb.map(m => {
            const key       = getMilestoneKey(rlKey, m.step);
            const state     = milestoneState[key];
            const isChecked = state?.completed === true;
            const autoColor = computeMilestoneStatus(m, p.goLiveDate, p.status);
            const due = parseLocalDate(p.goLive); due.setDate(due.getDate() + m.daysOffset);
            const ds  = due.toLocaleDateString('en-US',{month:'short',day:'numeric'});
            const badgeLabel = isChecked ? '✓ Complete'
              : { green:'✓ On Track', orange:'⚠ Due Soon', red:'✗ Overdue', white:`Due ${ds}` }[autoColor];
            const completedLine = isChecked && state
              ? `<div class="m-completedby">✓ ${escHtml(state.by||'Team')} · ${new Date(state.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`
              : '';
            const safeName = m.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
            return `<div class="milestone-item ${isChecked?'green':autoColor}${isChecked?' done-manual':''}" id="ms-${safeKey}-${m.step}">
              <div class="m-checkbox ${isChecked?'checked':''}"
                   onclick="toggleMilestone('${escHtml(rlKey)}',${m.step},'${safeName}')"
                   title="${isChecked?'Click to uncheck':'Click to mark complete'}">${isChecked?'✓':''}</div>
              <div class="m-content">
                <div class="m-name">${escHtml(m.name)}</div>
                <div class="m-meta">${m.owner} · Due ${ds}</div>
                ${completedLine}
              </div>
              <span class="m-badge ${isChecked?'green':autoColor}">${badgeLabel}</span>
            </div>`;
          }).join('');

          return `<div class="int-card">
            <div class="int-card-header" onclick="toggleBankCard('${safeKey}')">
              <div class="int-card-name">🏦 ${escHtml(bankTaskName)}</div>
              <div class="int-card-meta">
                <span style="font-size:10px;color:#9ca3af">RL task · no INT ticket yet</span>
              </div>
              <span class="int-card-chevron" id="bank-chev-${safeKey}">▼</span>
            </div>
            <div class="int-card-body" id="bank-body-${safeKey}">
            <div class="checklist-section-header pm-section-header" style="display:flex;align-items:center;justify-content:space-between">
              <span>Project Manager Checklist</span>
              <span id="br-count-${safeKey}" style="font-weight:600;opacity:0.85">${pmDone2}/${PM_CHECKLIST.length}</span>
            </div>
            <div class="int-card-milestones">${pmRows2}</div>
            <div class="checklist-section-header int-section-header">Integrations Team Checklist</div>
            <div class="int-card-milestones">${intRowsFb}</div>
            ${apiFormHtmlFb}
            </div><!-- /int-card-body -->
          </div>`;
        }).join('');

        if (p.tickets.length > 0) {
          intCardsHtml += `<div class="section-label" style="margin-top:14px;margin-bottom:6px;font-size:10px;letter-spacing:.08em;color:#6b7280">OTHER INT TICKETS</div>`;
          intCardsHtml += p.tickets.map(t => {
            const stale   = isStale(t);
            const updDays = Math.floor((Date.now() - new Date(t.updated)) / 86400000);
            return `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px">
              <a href="${escHtml(t.url)}" target="_blank" rel="noopener"
                 style="flex-shrink:0;background:#4f46e5;color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;text-decoration:none;white-space:nowrap;letter-spacing:.03em">
                ${escHtml(t.key)} ↗
              </a>
              <div style="flex:1;min-width:0">
                <div style="font-size:12px;font-weight:600;color:#1e293b;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.summary)}</div>
                <div style="font-size:11px;color:#64748b;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                  ${t.assignee !== 'Unassigned' ? `<span>🔧 ${escHtml(t.assignee)}</span>` : ''}
                  ${t.reporterName ? `<span>📝 ${escHtml(t.reporterName)}</span>` : ''}
                  <span>📅 ${t.updated}</span>
                  ${stale ? `<span class="stale-flag">⚠ Stale ${updDays}d</span>` : ''}
                </div>
              </div>
              <span class="jira-status ${t.statusCls}" style="flex-shrink:0">${escHtml(t.statusName)}</span>
            </div>`;
          }).join('');
        }
      } else {
        intCardsHtml = `<div class="int-no-tickets">🏦 No bank integration tickets found — <a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="color:#4f46e5">search the INT board →</a></div>`;
      }
    } else {
      intCardsHtml = bankTickets.map(t => {
        const safeKey = t.key.replace(/[^a-zA-Z0-9-]/g, '');
        const stale   = isStale(t);
        const intName = extractIntName(t.summary) || t.summary;

        // ── Find matching RL bank entry (for taskStart + subtask items) ──
        function findRLBankEntry(jiraIntName) {
          const map   = p.bankReadinessMap || {};
          const jNorm = normName(jiraIntName);
          if (!jNorm) return null;
          let bestEntry = null, bestLen = 0;
          for (const [bankTaskName, entry] of Object.entries(map)) {
            const bNorm = normName(bankTaskName);
            const sharedPrefix = Math.max(
              ...[4,5,6,7,8].map(n => (jNorm.slice(0,n) === bNorm.slice(0,n) ? n : 0))
            );
            if (sharedPrefix >= 4 && sharedPrefix > bestLen) {
              bestLen  = sharedPrefix;
              bestEntry = entry;
            }
          }
          return bestEntry;
        }

        const rlBankEntry = findRLBankEntry(intName);
        const rlBankItems = rlBankEntry?.items || [];
        const taskStart   = rlBankEntry?.taskStart || null;  // Rocketlane bank task start date
        const rlByNorm    = {};
        rlBankItems.forEach(item => { rlByNorm[normName(item.name)] = item; });

        function findRLMatch(pmName) {
          const pn = normName(pmName);
          // Pass 1: shared-prefix match (6+ chars)
          for (const [rn, item] of Object.entries(rlByNorm)) {
            if (pn.length >= 6 && rn.startsWith(pn.slice(0,6))) return item;
            if (rn.length >= 6 && pn.startsWith(rn.slice(0,6))) return item;
          }
          // Pass 2: longest shared word sequence (handles "All Banks Notified" ↔ "Bank Notified")
          const pWords = pn.match(/[a-z]{4,}/g) || [];
          for (const [rn, item] of Object.entries(rlByNorm)) {
            const rWords = new Set(rn.match(/[a-z]{4,}/g) || []);
            if (pWords.length > 0 && pWords.filter(w => rWords.has(w)).length >= Math.min(2, pWords.length)) return item;
          }
          return null;
        }

        // Helper: get the on-track date for a PM item (for display)
        function getPMOnTrackDate(pmItem) {
          const gl = parseLocalDate(p.goLive);
          const ts = taskStart ? parseLocalDate(taskStart) : new Date(gl.getTime() - 60 * 86400000);
          if (pmItem.phase === 3) return new Date(gl.getTime() + pmItem.onTrackCd * 86400000);
          return addBusinessDays(ts, pmItem.onTrackBd);
        }

        // ── PM Checklist: always rendered; RL auto-checks; status colors from milestone logic ──
        const pmDone = PM_CHECKLIST.filter(item => {
          const rlMatch = findRLMatch(item.name);
          const rlDone  = rlMatch && (rlMatch.rlStatus || '').toLowerCase().includes('complet');
          return rlDone || brState[`${t.key}__${item.id}`] === true;
        }).length;

        const pmRows = PM_CHECKLIST.map(pmItem => {
          const rlMatch     = findRLMatch(pmItem.name);
          const rlDone      = rlMatch && (rlMatch.rlStatus || '').toLowerCase().includes('complet');
          const manKey      = `${t.key}__${pmItem.id}`;
          const manDone     = !rlDone && brState[manKey] === true;
          const isDone      = rlDone || manDone;
          const autoColor   = computePMItemStatus(pmItem, taskStart, p.goLive, isDone);
          const dispColor   = autoColor === 'blocker' ? 'red' : autoColor;
          const isBlocker   = autoColor === 'blocker' && !isDone;
          const onTrackDate = getPMOnTrackDate(pmItem);
          const onTrackStr  = onTrackDate.toLocaleDateString('en-US', { month:'short', day:'numeric' });

          const onclickStr  = rlDone
            ? `style="cursor:default" title="Completed in Rocketlane — read-only"`
            : `onclick="toggleBRItem('${escHtml(t.key)}','${pmItem.id}')" title="Click to toggle"`;
          const metaLabel   = isDone
            ? (rlDone ? '<span style="color:#16a34a">✓ Rocketlane</span>' : '<span style="color:#4f46e5">✓ Manual</span>')
            : `PM · on track by ${onTrackStr}`;
          const badgeText   = isDone
            ? (rlDone ? 'RL ✓' : 'Manual ✓')
            : isBlocker ? '🚨 Blocker'
            : { red:'✗ Overdue', orange:'⚠ At Risk', green:'✓ On Track', white:`Due ${onTrackStr}` }[dispColor] || `Due ${onTrackStr}`;

          return `<div class="milestone-item ${isDone?'done-manual':isBlocker?'blocker':dispColor}" id="br-row-${safeKey}-${pmItem.id}">
            <div class="m-checkbox${isDone?' checked':''}" id="br-cb-${safeKey}-${pmItem.id}" ${onclickStr}>${isDone?'✓':''}</div>
            <div class="m-content">
              <div class="m-name">${escHtml(pmItem.name)}</div>
              <div class="m-meta">${metaLabel}</div>
            </div>
            <span class="m-badge ${isDone?'green':dispColor}" id="br-badge-${safeKey}-${pmItem.id}">${badgeText}</span>
          </div>`;
        }).join('');

        // ── API Form Complete (auto from Jira or manual override) ──
        const apiFormTicket = findJiraApiForm(p);
        const apiFormJira   = !!apiFormTicket;
        const apiFormManual = !apiFormJira && brState[`${t.key}__api-form`] === true;
        const apiFormDone   = apiFormJira || apiFormManual;
        const apiFormHtml   = `<div class="checklist-section-header" style="background:#ecfdf5;color:#065f46;border-top:2px solid #d1fae5;margin-top:2px">API Form</div>
          <div class="int-card-milestones">
            <div class="milestone-item ${apiFormDone?'green done-manual':'white'}" id="br-row-${safeKey}-api-form">
              <div class="m-checkbox${apiFormDone?' checked':''}" id="br-cb-${safeKey}-api-form"
                   ${apiFormJira ? 'style="cursor:default" title="Auto-detected: API form found in Jira"'
                                 : `onclick="toggleBRItem('${escHtml(t.key)}','api-form')" title="${apiFormManual?'Click to uncheck':'Click to mark complete'}"`}>
                ${apiFormDone?'✓':''}
              </div>
              <div class="m-content">
                <div class="m-name">API Form Complete</div>
                <div class="m-meta">${apiFormJira
                  ? `<a href="${escHtml(apiFormTicket.url)}" target="_blank" style="color:#4f46e5">${escHtml(apiFormTicket.key)} ↗</a>`
                  : `<span style="color:#6b7280">Required before go-live</span>`}</div>
              </div>
              <span class="m-badge ${apiFormDone?'green':'white'}" id="br-badge-${safeKey}-api-form">${apiFormJira ? '✓ Jira' : (apiFormManual ? 'Manual ✓' : 'Pending')}</span>
            </div>
          </div>`;

        // ── INT Checklist: steps 5-9 from lifecycle (Credentials → Post GL) ──
        const intSteps = MILESTONES.filter(m => m.step >= 5 && m.step <= 9);
        const intRows  = intSteps.map(m => {
          const key       = getMilestoneKey(t.key, m.step);
          const state     = milestoneState[key];
          const isChecked = state?.completed === true;
          const autoColor = computeMilestoneStatus(m, p.goLiveDate, p.status);
          const due = parseLocalDate(p.goLive); due.setDate(due.getDate() + m.daysOffset);
          const ds  = due.toLocaleDateString('en-US',{month:'short',day:'numeric'});
          const badgeLabel = isChecked ? '✓ Complete'
            : { green:'✓ On Track', orange:'⚠ Due Soon', red:'✗ Overdue', white:`Due ${ds}` }[autoColor];
          const completedLine = isChecked && state
            ? `<div class="m-completedby">✓ ${escHtml(state.by||'Team')} · ${new Date(state.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div>`
            : '';
          const safeName = m.name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
          return `<div class="milestone-item ${isChecked?'green':autoColor}${isChecked?' done-manual':''}" id="ms-${safeKey}-${m.step}">
            <div class="m-checkbox ${isChecked?'checked':''}"
                 onclick="toggleMilestone('${escHtml(t.key)}',${m.step},'${safeName}')"
                 title="${isChecked?'Click to uncheck':'Click to mark complete'}">${isChecked?'✓':''}</div>
            <div class="m-content">
              <div class="m-name">${escHtml(m.name)}</div>
              <div class="m-meta">${m.owner} · Due ${ds}</div>
              ${completedLine}
            </div>
            <span class="m-badge ${isChecked?'green':autoColor}">${badgeLabel}</span>
          </div>`;
        }).join('');

        return `<div class="int-card">
          <div class="int-card-header" onclick="toggleBankCard('${safeKey}')">
            <div class="int-card-name">🏦 ${escHtml(intName)}</div>
            <div class="int-card-jira" onclick="event.stopPropagation()">
              <a class="int-card-key" href="${escHtml(t.url)}" target="_blank" rel="noopener">${escHtml(t.key)}</a>
            </div>
            <div class="int-card-meta">
              <span class="jira-status ${t.statusCls}">${escHtml(t.statusName)}</span>
              ${t.assignee !== 'Unassigned' ? `<span>🔧 ${escHtml(t.assignee)}</span>` : ''}
              ${t.reporterName ? `<span>📝 ${escHtml(t.reporterName)}</span>` : ''}
              ${stale ? `<span class="stale-flag">⚠ Stale ${Math.floor((Date.now()-new Date(t.updated))/86400000)}d</span>` : ''}
            </div>
            <span class="int-card-chevron" id="bank-chev-${safeKey}">▼</span>
          </div>
          <div class="int-card-body" id="bank-body-${safeKey}">
          <div class="checklist-section-header pm-section-header" style="display:flex;align-items:center;justify-content:space-between">
            <span>Project Manager Checklist</span>
            <span id="br-count-${safeKey}" style="font-weight:600;opacity:0.85">${pmDone}/${PM_CHECKLIST.length}</span>
          </div>
          <div class="int-card-milestones">${pmRows}</div>
          <div class="checklist-section-header int-section-header">Integrations Team Checklist</div>
          <div class="int-card-milestones">${intRows}</div>
          ${apiFormHtml}
          ${(() => {
            const recentComments = (t.comments || []).slice(-3).reverse(); // most recent first
            if (!recentComments.length) return '';
            const commentRows = recentComments.map(c => {
              const dateStr = c.date ? new Date(c.date + 'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '';
              // Strip [INT-*] tags and truncate long bodies
              const body = c.body.replace(/\[INT-[A-Z]+\][^\n]*/g,'').trim();
              const truncated = body.length > 300 ? body.slice(0,300) + '…' : body;
              return `<div class="activity-item">
                <div class="activity-meta">
                  <span class="activity-source jira-source">Jira</span>
                  <span class="activity-author">${escHtml(c.author)}</span>
                  <span class="activity-date">${dateStr}</span>
                </div>
                <div class="activity-body">${escHtml(truncated)}</div>
              </div>`;
            }).join('');
            return `<div class="activity-feed">
              <div class="activity-feed-header">💬 Recent Jira Comments</div>
              ${commentRows}
            </div>`;
          })()}
          <div class="int-card-comment-area">
            <div style="padding:4px 10px;display:flex;justify-content:flex-end">
              <button class="comment-btn" onclick="toggleCommentForm('${safeKey}')">💬 Add Jira Comment</button>
            </div>
            <div class="comment-form" id="cf-${safeKey}" style="display:none">
              <textarea class="comment-textarea" id="ct-${safeKey}" placeholder="Type your comment…"></textarea>
              <div class="comment-actions">
                <button class="comment-submit" id="cs-${safeKey}" onclick="submitComment('${safeKey}','${escHtml(t.key)}')">Post Comment</button>
                <button class="comment-cancel" onclick="toggleCommentForm('${safeKey}')">Cancel</button>
                <span class="comment-status" id="cst-${safeKey}"></span>
              </div>
            </div>
          </div>
          </div><!-- /int-card-body -->
        </div>`;
      }).join('');
      // ── Non-bank tickets: show as clickable cards below bank cards ──────────
      const nonBankTickets = p.tickets.filter(t => !isBankTicket(t.summary));
      if (nonBankTickets.length) {
        intCardsHtml += `<div class="section-label" style="margin-top:14px;margin-bottom:6px;font-size:10px;letter-spacing:.08em;color:#6b7280">OTHER INT TICKETS</div>`;
        intCardsHtml += nonBankTickets.map(t => {
          const stale   = isStale(t);
          const safeKey = t.key.replace(/[^a-zA-Z0-9-]/g, '');
          const updDays = Math.floor((Date.now() - new Date(t.updated)) / 86400000);
          return `<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;display:flex;align-items:flex-start;gap:10px">
            <a href="${escHtml(t.url)}" target="_blank" rel="noopener"
               style="flex-shrink:0;background:#4f46e5;color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;text-decoration:none;white-space:nowrap;letter-spacing:.03em">
              ${escHtml(t.key)} ↗
            </a>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:600;color:#1e293b;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(t.summary)}</div>
              <div style="font-size:11px;color:#64748b;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
                ${t.assignee !== 'Unassigned' ? `<span>🔧 ${escHtml(t.assignee)}</span>` : ''}
                ${t.reporterName ? `<span>📝 ${escHtml(t.reporterName)}</span>` : ''}
                <span>📅 ${t.updated}</span>
                ${stale ? `<span class="stale-flag">⚠ Stale ${updDays}d</span>` : ''}
              </div>
            </div>
            <span class="jira-status ${t.statusCls}" style="flex-shrink:0">${escHtml(t.statusName)}</span>
          </div>`;
        }).join('');
      }
    }
  }

  // ── Right column: all Jira tickets (unchanged from before) ───────────────────
  let jiraHtml;
  if (!jiraLoaded) {
    jiraHtml = `<div class="no-tickets">⏳ Loading Jira tickets…</div>`;
  } else if (jiraError) {
    jiraHtml = `<div class="no-tickets">⚠️ Jira unavailable — <a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="color:#4f46e5">Open INT board</a></div>`;
  } else if (!p.tickets.length) {
    jiraHtml = `<div class="no-tickets">🎫 No INT tickets matched to this client.<br><span style="font-size:11px"><a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="color:#4f46e5">Search the INT board →</a></span></div>`;
  } else {
    jiraHtml = p.tickets.map(t => {
      const stale   = isStale(t);
      const safeKey = t.key.replace(/[^a-zA-Z0-9-]/g,'');
      return `<div style="margin-bottom:8px">
        <a class="jira-ticket" href="${escHtml(t.url)}" target="_blank" rel="noopener">
          <span class="jira-key">${escHtml(t.key)}</span>
          <div class="jira-content">
            <div class="jira-summary">${escHtml(t.summary)}</div>
            <div class="jira-meta">
              <span>🔧 ${escHtml(t.assignee)}</span>
              ${t.reporterName ? `<span>📝 ${escHtml(t.reporterName)}</span>` : ''}
              <span>📅 Updated ${t.updated}</span>
              ${stale ? `<span class="stale-flag">⚠ Stale ${Math.floor((Date.now()-new Date(t.updated))/86400000)}d</span>` : ''}
            </div>
          </div>
          <span class="jira-status ${t.statusCls}">${escHtml(t.statusName)}</span>
        </a>
        <div style="padding:3px 10px 0;display:flex;justify-content:flex-end">
          <button class="comment-btn" onclick="toggleCommentForm('${safeKey}')">💬 Add Comment</button>
        </div>
        <div class="comment-form" id="cf-${safeKey}" style="display:none">
          <textarea class="comment-textarea" id="ct-${safeKey}" placeholder="Type your comment… (supports Markdown)"></textarea>
          <div class="comment-actions">
            <button class="comment-submit" id="cs-${safeKey}" onclick="submitComment('${safeKey}','${escHtml(t.key)}')">Post Comment</button>
            <button class="comment-cancel" onclick="toggleCommentForm('${safeKey}')">Cancel</button>
            <span class="comment-status" id="cst-${safeKey}"></span>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  // ── Notes ────────────────────────────────────────────────────────────────────
  const primaryTicket = (p.tickets.find(t => isBankTicket(t.summary)) || p.tickets[0])?.key || '';
  const safePrimary   = primaryTicket.replace(/[^a-zA-Z0-9-]/g, '');
  const projectNotes  = notesState[p.id] || [];
  const notesListHtml = projectNotes.length
    ? projectNotes.map(n => {
        const dt = new Date(n.at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
        return `<div class="note-item"><div class="note-meta">📝 ${escHtml(n.by)} &nbsp;·&nbsp; ${dt}</div><div class="note-text">${escHtml(n.text)}</div></div>`;
      }).join('')
    : `<div class="notes-empty">No notes yet — add the first one below.</div>`;

  return `<div class="detail-grid">
    <div>
      <div class="section-label">Bank Integration Checklists
        <span style="font-weight:400;text-transform:none;font-size:10px;color:#9ca3af"> · checkboxes sync via Jira</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">${intCardsHtml}</div>
    </div>
    <div class="detail-right">
      <div class="detail-section">
        <div class="section-label">Team</div>
        <div class="team-chips">${pmChips||''}${intChips||''}</div>
        ${!pmChips&&!intChips?'<div style="font-size:12px;color:#9ca3af;margin-top:6px">No team members found in Rocketlane</div>':''}
      </div>
      <div class="detail-section">
        <div class="section-label">Rocketlane Details</div>
        <div class="info-row">
          <strong>Project:</strong> ${escHtml(p.projectName)}<br>
          <strong>Status:</strong> ${escHtml(p.status)}<br>
          <strong>Go-Live:</strong> ${parseLocalDate(p.goLive).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}<br>
          <strong>Countdown:</strong> ${glLabel}<br>
          <strong>Readiness:</strong> ${Math.round(p.progress)}% <span style="color:#9ca3af;font-size:11px">(${p.preGlDone}/${p.preGlTotal} pre-go-live tasks)</span>
        </div>
        <a class="rl-link" href="https://vantaca.rocketlane.com/projects/${escHtml(p.id)}/plan" target="_blank" rel="noopener">↗ Open in Rocketlane</a>
      </div>
      <div class="jira-section">
        <div class="section-label" style="margin-bottom:10px">INT Tickets — Jira
          ${p.tickets.length ? `<a href="https://vantaca.atlassian.net/jira/software/c/projects/INT/boards/69" target="_blank" style="font-weight:400;text-transform:none;font-size:10px;color:#4f46e5;margin-left:6px">View full board →</a>` : ''}
        </div>
        ${jiraHtml}
      </div>
      <div class="notes-section">
        <div class="notes-header">
          <div class="section-label" style="margin:0">📋 Running Notes
            <span style="font-weight:400;text-transform:none;font-size:10px;color:#9ca3af"> · timestamped · syncs via Jira</span>
          </div>
          <span id="notes-count-${p.id}" style="font-size:10px;color:#9ca3af">${projectNotes.length} note${projectNotes.length!==1?'s':''}</span>
        </div>
        <div class="notes-list" id="notes-list-${p.id}">${notesListHtml}</div>
        <div class="note-input-area">
          <textarea class="note-textarea" id="note-ta-${p.id}"
            placeholder="Add a note…"
            onkeydown="if(event.key==='Enter'&&(event.metaKey||event.ctrlKey)){addNote('${p.id}','${safePrimary}');event.preventDefault();}"></textarea>
          <div class="note-actions">
            <button class="note-submit" id="note-btn-${p.id}" onclick="addNote('${p.id}','${safePrimary}')">Add Note</button>
            <span style="font-size:10px;color:#9ca3af">⌘↵ to save</span>
            <span class="note-status-msg" id="note-st-${p.id}"></span>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function updateStats() {
  const total  = allProjects.length;
  const red    = allProjects.filter(p=>p.statusColor==='red').length;
  const orange = allProjects.filter(p=>p.statusColor==='orange').length;
  const green  = allProjects.filter(p=>p.statusColor==='green').length;
  const stale  = jiraLoaded ? allProjects.filter(p=>p.tickets.some(t=>isStale(t))).length : 0;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-chip"><span class="stat-dot" style="background:#a5b4fc"></span> ${total} clients</div>
    <div class="stat-chip"><span class="stat-dot" style="background:var(--red)"></span> ${red} critical</div>
    <div class="stat-chip"><span class="stat-dot" style="background:var(--orange)"></span> ${orange} at risk</div>
    <div class="stat-chip"><span class="stat-dot" style="background:var(--green)"></span> ${green} live/on track</div>
    ${stale>0?`<div class="stat-chip"><span class="stat-dot" style="background:#fbbf24"></span> ${stale} stale Jira</div>`:''}
    ${jiraLoaded&&!jiraError?`<div class="stat-chip"><span class="stat-dot" style="background:#818cf8"></span> ${jiraTickets.length} INT tickets</div>`:''}
  `;
}

function toggleExpand(id) { if(expandedRows.has(id)) expandedRows.delete(id); else expandedRows.add(id); renderTable(); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ══ JIRA COMMENTS ══ */
function toggleBankCard(safeKey) {
  const body    = document.getElementById('bank-body-' + safeKey);
  const chevron = document.getElementById('bank-chev-' + safeKey);
  if (!body) return;
  const isCollapsed = body.classList.toggle('collapsed');
  if (chevron) chevron.classList.toggle('collapsed', isCollapsed);
}

function toggleCommentForm(safeKey) {
  const form = document.getElementById(`cf-${safeKey}`);
  if (!form) return;
  const isOpen = form.style.display !== 'none';
  form.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) {
    const ta = document.getElementById(`ct-${safeKey}`);
    if (ta) ta.focus();
  }
}

async function submitComment(safeKey, issueKey) {
  const ta  = document.getElementById(`ct-${safeKey}`);
  const btn = document.getElementById(`cs-${safeKey}`);
  const st  = document.getElementById(`cst-${safeKey}`);
  const text = (ta?.value || '').trim();
  if (!text) { if (st) { st.textContent = 'Comment cannot be empty.'; st.style.color = '#b91c1c'; } return; }

  btn.disabled = true; btn.textContent = 'Posting…';
  if (st) { st.textContent = ''; }

  try {
    await callMcp(
      'mcp__febcc92f-9040-4ea4-b33e-6aacbf9fcb04__addCommentToJiraIssue',
      {
        cloudId:       JIRA_CLOUD,
        issueIdOrKey:  issueKey,
        body:          text,
        contentFormat: 'markdown',
      }
    );
    ta.value = '';
    if (st) { st.textContent = '✓ Posted!'; st.style.color = '#15803d'; }
    btn.textContent = 'Post Comment'; btn.disabled = false;
    setTimeout(() => { toggleCommentForm(safeKey); if (st) st.textContent = ''; }, 1800);
  } catch(e) {
    if (st) { st.textContent = `Error: ${e?.message || 'Could not post comment'}`; st.style.color = '#b91c1c'; }
    btn.textContent = 'Post Comment'; btn.disabled = false;
  }
}

/* ══ VIEW SWITCHER ══ */

/* ══ API FORM LOOKUP — uses already-loaded p.tickets ══
   The main loadJira() JQL now includes API form tickets (Done or not) from 2025+,
   so they're already assigned to the right client via matchesClient().
   We just need to find which of a client's tickets is an API form ticket.
*/
const API_FORM_RE = /api\s*agreement\s*form|signed\s*api\s*form|api\s*form/i;

function findJiraApiForm(client) {
  if (!client.tickets) return null;
  return client.tickets.find(t => API_FORM_RE.test(t.summary)) || null;
}


loadData();
